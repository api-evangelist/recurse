name: Recurse
description: >-
  Recurse ML is an AI-powered code review platform built for modern development
  workflows that lean on AI coding assistants like Cursor, Claude Code, and GitHub
  Copilot. It understands a whole codebase's context to catch subtle bugs, breaking
  changes, library/API misuse, and SQL query issues that tests and static analyzers
  miss, and returns actionable feedback with one-click fixes. Recurse ships as a
  GitHub App that reviews pull requests, an rml CLI for local and CI/CD review, and
  ReMCP, a Model Context Protocol server that turns Recurse into a self-healing
  quality gate AI agents call to fix their own mistakes. It advertises a zero data
  retention policy and is pursuing SOC 2 compliance.
